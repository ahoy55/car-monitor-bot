services:
  postgres:
    image: postgres:15
    container_name: car_monitor_postgres
    environment:
      - POSTGRES_DB=car_bot
      - POSTGRES_USER=car_user
      - POSTGRES_PASSWORD=car_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - car_network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_user -d car_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    container_name: car_monitor_bot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://car_user:car_password@postgres:5432/car_bot
      - PYTHONPATH=/app/src
      - SOURCES_PATH=/app/data/sources.json
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - car_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  car_network:
    driver: bridge