name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DEPLOY_DIR: /opt/car-bot

jobs:
  build:
    name: Сборка образа
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверка синтаксиса
        run: python -m compileall -q src scripts

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Деплой на сервер
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Расшифровка sources.json
        env:
          SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
        run: bash decrypt.sh

      - name: Настройка SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Формирование .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.TG_BOT_ADMIN }}
          CHANNEL_CHAT_ID: ${{ secrets.TG_CHANNEL_ID }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          NEW_THREAD_ID: ${{ secrets.TG_NEW_THREAD_ID }}
          PRICE_DROP_THREAD_ID: ${{ secrets.TG_PRICE_DROP_THREAD_ID }}
        run: |
          set -euo pipefail
          umask 077
          # Пустые переменные не пишем: Config приводит THREAD_ID к int,
          # и пустая строка уронила бы приложение на старте.
          {
            echo "APP_IMAGE=${IMAGE}:${GITHUB_SHA}"
            echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}"
            echo "ADMIN_CHAT_ID=${ADMIN_CHAT_ID}"
            echo "CHANNEL_CHAT_ID=${CHANNEL_CHAT_ID}"
            if [ -n "${USER_PASSWORD:-}" ]; then echo "USER_PASSWORD=${USER_PASSWORD}"; fi
            if [ -n "${NEW_THREAD_ID:-}" ]; then echo "NEW_THREAD_ID=${NEW_THREAD_ID}"; fi
            if [ -n "${PRICE_DROP_THREAD_ID:-}" ]; then echo "PRICE_DROP_THREAD_ID=${PRICE_DROP_THREAD_ID}"; fi
          } > deploy.env
          echo "Записано строк: $(wc -l < deploy.env)"

      - name: Копирование файлов на сервер
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT $SSH_USER@$SSH_HOST"

          # без sudo: каталог создаётся один раз при подготовке сервера
          # и принадлежит пользователю деплоя
          $SSH "mkdir -p $DEPLOY_DIR/data $DEPLOY_DIR/logs" || {
            echo "❌ Нет доступа к $DEPLOY_DIR."
            echo "   Разовая подготовка сервера:"
            echo "     sudo mkdir -p $DEPLOY_DIR/data $DEPLOY_DIR/logs"
            echo "     sudo chown -R \$USER:\$USER $DEPLOY_DIR"
            exit 1
          }

          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
              docker-compose.yml \
              "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/docker-compose.yml"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
              data/sources.json \
              "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/data/sources.json"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
              deploy.env \
              "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/.env"

      - name: Авторизация сервера в GHCR
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Токен уходит через stdin, в логи не попадает
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Запуск на сервере
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              "DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          if ! docker compose version >/dev/null 2>&1; then
            echo "❌ На сервере нет docker compose v2 (плагина docker-compose-plugin)"
            exit 1
          fi

          if ! docker info >/dev/null 2>&1; then
            echo "❌ Пользователь деплоя не имеет доступа к docker."
            echo "   Разовая подготовка: sudo usermod -aG docker \$USER"
            exit 1
          fi

          cd "$DEPLOY_DIR"

          echo "📦 Забираем образ..."
          docker compose pull

          echo "🚀 Перезапускаем..."
          docker compose up -d --no-build --remove-orphans

          echo "⏳ Ждём, пока приложение поднимется..."
          sleep 20

          state=$(docker inspect -f '{{.State.Status}}' car_monitor_bot 2>/dev/null || echo missing)
          restarts=$(docker inspect -f '{{.RestartCount}}' car_monitor_bot 2>/dev/null || echo 0)

          if [ "$state" != "running" ] || [ "$restarts" -gt 0 ]; then
            echo "❌ Контейнер не поднялся (статус=$state, перезапусков=$restarts)"
            docker compose logs --tail=80 app
            exit 1
          fi

          echo "✅ Контейнер работает"
          docker compose logs --tail=20 app
          docker image prune -f >/dev/null
          REMOTE

      - name: Очистка ключа
        if: always()
        run: rm -f ~/.ssh/deploy_key deploy.env
